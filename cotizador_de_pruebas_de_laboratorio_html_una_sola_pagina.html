<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador de Laboratorio</title>
<style>
    body {font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5;}
    .container {max-width: 500px; margin: auto; background: #ffffff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    h1 {text-align: center; color: #333333; font-size: 1.4em;}
    input {width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc;}
    .suggestions {background: #fff; border: 1px solid #ccc; border-radius: 5px; max-height: 150px; overflow-y: auto; position: relative; z-index: 10;}
    .suggestions div {padding: 8px; cursor: pointer;}
    .suggestions div:hover {background: #f0f0f0;}
    table {width: 100%; border-collapse: collapse; margin-top: 15px;}
    th, td {border: 1px solid #cccccc; padding: 10px; text-align: left; font-size: 0.9em;}
    th {background-color: #f08080; color: #fff;}
    .total {text-align: left; font-weight: bold; margin-top: 10px; color: #a94442; font-size: 1.1em;}
    .delete-btn {background: none; border: none; color: #ff3333; cursor: pointer; font-weight: bold;}
    .delete-btn:hover {color: #cc0000;}
    button.agregar {background-color: #666666; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;}
</style>
</head>
<body>
<div class="container">
<h1>Cotizador de Laboratorio</h1>

<label for="fileInput">Cargar archivo Excel (.xlsx o .csv):</label>
<input type="file" id="fileInput" accept=".xlsx,.csv"><br>

<input type="text" id="search" placeholder="Buscar prueba...">
<div class="suggestions" id="suggestions"></div>

<h2 style="font-size:1.2em; text-align:center;">Cotización</h2>
<table id="cotizacion">
    <thead>
        <tr>
            <th>Prueba</th>
            <th>Precio (Bs)</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<div class="total">Total: Bs <span id="total">0</span></div>

<button onclick="reiniciarCotizacion()" style="width:100%; margin-top:10px;">Comenzar de nuevo</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let pruebas = [];
let cotizacion = [];

const fileInput = document.getElementById('fileInput');
const searchInput = document.getElementById('search');
const suggestionsDiv = document.getElementById('suggestions');
const totalSpan = document.getElementById('total');

fileInput.addEventListener('change', handleFile);
searchInput.addEventListener('input', mostrarSugerencias);

function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        pruebas = XLSX.utils.sheet_to_json(sheet);
    };
    reader.readAsArrayBuffer(file);
}

function mostrarSugerencias() {
    const query = searchInput.value.toLowerCase();
    suggestionsDiv.innerHTML = '';
    if (!query) return;
    const filtradas = pruebas.filter(p => (p.prueba || '').toLowerCase().includes(query));
    filtradas.forEach(prueba => {
        const div = document.createElement('div');
        div.textContent = `${prueba.prueba} - Bs ${prueba.precio}`;
        div.onclick = () => {
            agregarACotizacion(prueba.prueba);
            suggestionsDiv.innerHTML = '';
            searchInput.value = '';
        };
        suggestionsDiv.appendChild(div);
    });
}

function agregarACotizacion(nombrePrueba) {
    const prueba = pruebas.find(p => p.prueba === nombrePrueba);
    if (prueba && !cotizacion.some(p => p.prueba === nombrePrueba)) {
        cotizacion.push(prueba);
        actualizarCotizacion();
    }
}

function eliminarDeCotizacion(nombrePrueba) {
    cotizacion = cotizacion.filter(p => p.prueba !== nombrePrueba);
    actualizarCotizacion();
}

function actualizarCotizacion() {
    const tbody = document.querySelector('#cotizacion tbody');
    tbody.innerHTML = '';
    let total = 0;
    cotizacion.forEach(prueba => {
        total += parseFloat(prueba.precio) || 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${prueba.prueba || ''}</td>
            <td>${prueba.precio || ''}</td>
            <td><button class="delete-btn" onclick="eliminarDeCotizacion('${prueba.prueba || ''}')">Eliminar</button></td>
        `;
        tbody.appendChild(tr);
    });
    totalSpan.textContent = total.toFixed(2);
}

function reiniciarCotizacion() {
    cotizacion = [];
    actualizarCotizacion();
}
</script>
</body>
</html>
